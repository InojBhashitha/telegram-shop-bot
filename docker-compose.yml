services:
  # --- Telegram Shop Bot & FastAPI WebApp Service ---
  shop-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-shop-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=sqlite+aiosqlite:////app/data/shop.db
    volumes:
      - shop-data:/app/data
    networks:
      - shop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --- Caddy Automatic SSL Reverse Proxy ---
  caddy:
    image: caddy:2.9-alpine
    container_name: telegram-shop-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC) support
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - SSL_EMAIL=${SSL_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      shop-app:
        condition: service_healthy
    networks:
      - shop-network

volumes:
  shop-data:
    name: telegram_shop_data
  caddy-data:
    name: telegram_shop_caddy_data
  caddy-config:
    name: telegram_shop_caddy_config

networks:
  shop-network:
    name: telegram_shop_network
    driver: bridge
