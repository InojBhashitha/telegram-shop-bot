version: "3.8"

services:
  cloud-deals:
    build: .
    container_name: cloud-deals
    restart: unless-stopped
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./cloud_deals.db:/app/cloud_deals.db
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

