services:
  - type: web
    name: cloud-deals
    runtime: python
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: python run.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: CRYPTO_PROVIDER
        value: nowpayments
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false
      - key: NOWPAYMENTS_SANDBOX
        value: "true"
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: STORE_NAME
        value: Cloud Deals
      - key: SUPPORT_USERNAME
        sync: false
      - key: ORDER_EXPIRY_MINUTES
        value: "30"
      - key: LOG_LEVEL
        value: INFO
